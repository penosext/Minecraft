name: Build For X7 & Upload AMR

on:
  workflow_dispatch:

env:
  TOOLCHAIN_URL: https://github.com/penosext/Cloudpan/releases/download/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''

      - name: Install dependencies & toolchain
        run: |
          npm install -g pnpm@latest-10
          pnpm install --verbose -C ./ui
          mkdir -p ./jsapi/toolchains
          wget -q ${{ env.TOOLCHAIN_URL }} -O ./jsapi/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2
          tar -xjf ./jsapi/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2 -C ./jsapi/toolchains

      - name: Build
        run: |
          # The aiot-vue-cli Vue 3 / TypeScript patches are applied by
          # tools/patch-cli.cjs inside build.sh (idempotent).
          sed -i '/project(/a\set(CMAKE_DEPEND_INFO_SKIP 1)\nset(CMAKE_LINK_DEPENDS_USE_LINKER 0)' ./jsapi/CMakeLists.txt
          chmod +x ./tools/build.sh
          ./tools/build.sh

      - name: Check device glibc compatibility
        run: |
          # The pen runs glibc 2.36; a newer symbol version makes the app fail to load.
          # readelf reads the aarch64 ELF on the x86 runner.
          so=ui/libs/libjsapi_Minecraft.so
          max=$(readelf -V --wide "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest required: $max"
          [ "$(printf '%s\nGLIBC_2.36\n' "$max" | sort -V | tail -1)" = "GLIBC_2.36" ] || { echo "requires $max > GLIBC_2.36"; exit 1; }

      - name: Collect AMR files
        run: |
          find . -type f -iname '*.amr' > amr_files.txt || true
          echo "Found $(wc -l < amr_files.txt) .amr files"
          cat amr_files.txt

      - name: Rename AMR files with build number
        id: rename
        run: |
          num=$(printf '%s' "${{ github.run_number }}" | md5sum | cut -c1-6)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          cd ./dist
          for f in *.amr; do
            [ -e "$f" ] || continue
            base="${f%.amr}"
            mv "$f" "${base}-${num}.amr"
            echo "Renamed to ${base}-${num}.amr"
          done

      - name: Upload AMR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x7-amr-files-${{ steps.rename.outputs.num }}
          path: './dist/*.amr'
          if-no-files-found: error
          retention-days: 1
