name: Build For AArch64 & Upload AMR

on:
  workflow_dispatch:

env:
  # aarch64 (arm64) glibc 交叉编译工具链（Buildroot）
  TOOLCHAIN_URL: https://github.com/penosext/Cloudpan/releases/download/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2
  # 可选：Minecraft 客户端 .so 的下载地址（若留空则使用仓库内 vendor/libminecraft.so）
  # 注意：上游 minecraft-console 仅支持 Windows x64，需先移植到 aarch64 并导出 minecraft_main 入口后，
  #       把编译产物 libminecraft.so 放到这里提供下载。
  CLIENT_SO_URL: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''

      - name: Install dependencies & toolchain
        run: |
          npm install -g pnpm@latest-10
          pnpm install --verbose -C ./ui
          mkdir -p ./jsapi/toolchains
          wget -q ${{ env.TOOLCHAIN_URL }} -O ./jsapi/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2
          tar -xjf ./jsapi/toolchains/aarch64--glibc--stable-2018.11-1.tar.bz2 -C ./jsapi/toolchains

      - name: Download Minecraft client .so (optional)
        if: ${{ env.CLIENT_SO_URL != '' }}
        run: |
          mkdir -p ./vendor
          wget -q ${{ env.CLIENT_SO_URL }} -O ./vendor/libminecraft.so

      - name: Build
        run: |
          cd ./ui
          sed -i "s/commonjs(),/commonjs(),require('@rollup\/plugin-typescript')(),/g" ./node_modules/aiot-vue-cli/src/libs/rollup.config.js
          sed -i "s/compiler.parseComponent(content, { pad: 'line' })/compiler.parse(content, { pad: 'line' }).descriptor/g" ./node_modules/aiot-vue-cli/web-loaders/falcon-vue-loader/lib/parser.js
          sed -i "s/path.resolve(__dirname, '.\/vue\/packages\/vue-template-compiler\/index.js')/'@vue\/compiler-sfc'/g" ./node_modules/aiot-vue-cli/cli-libs/index.js
          sed -i "s/compiler.parseComponent(content, { pad: true })/compiler.parse(content, { pad: true }).descriptor/g" ./node_modules/aiot-vue-cli/src/libs/parser.js
          sed -i "s/compiler.compile/compiler.compileTemplate/g" ./node_modules/aiot-vue-cli/web-loaders/falcon-vue-loader/lib/template-compiler/index.js
          sed -i "s/const replaceValues = {}/const replaceValues = { 'defineComponent': '' }/g" ./node_modules/aiot-vue-cli/src/libs/rollup.config.js
          cd ..
          ./tools/build.sh

      - name: Collect AMR files
        run: |
          find . -type f -iname '*.amr' > amr_files.txt || true
          echo "Found $(wc -l < amr_files.txt) .amr files"
          cat amr_files.txt

      - name: Rename AMR files with build number
        id: rename
        run: |
          num=$(printf '%s' "${{ github.run_number }}" | md5sum | cut -c1-6)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          cd ./dist
          for f in *.amr; do
            [ -e "$f" ] || continue
            base="${f%.amr}"
            mv "$f" "${base}-${num}.amr"
            echo "Renamed to ${base}-${num}.amr"
          done

      - name: Upload AMR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-aarch64-amr-files-${{ steps.rename.outputs.num }}
          path: './dist/*.amr'
          if-no-files-found: ignore
          retention-days: 1
